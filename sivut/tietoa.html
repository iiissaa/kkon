<script>
document.addEventListener("DOMContentLoaded", function() {
  let lastScroll = 0;
  const nav = document.querySelector('nav');

  window.addEventListener('scroll', () => {
    const currentScroll = window.pageYOffset;

    if (currentScroll > lastScroll && currentScroll > 50) {
      nav.classList.add('hidden');
    } else {
      nav.classList.remove('hidden');
    }
    lastScroll = currentScroll;
  });
});
document.addEventListener("DOMContentLoaded", function() {
  const hamburger = document.querySelector('.hamburger');
  const navLinks = document.querySelector('.nav-links');

  hamburger.addEventListener('click', () => {
    navLinks.classList.toggle('active'); 
  });
});


</script>

<section>
  <h2>Liiketilat</h2>
  <div class="gallery">
    <img src="images/tila1.jpg" onclick="openLightbox(this)">
    <img src="images/tila2.jpg" onclick="openLightbox(this)">
    <img src="images/tila3.jpg" onclick="openLightbox(this)">

  </div>

<div id="lightbox">
  <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
  <span class="lightbox-prev" onclick="prevImage()">&#10094;</span>
  <img id="lightbox-img" src="">
  <span class="lightbox-next" onclick="nextImage()">&#10095;</span>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
  const galleryImages = document.querySelectorAll('.gallery img');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  let currentIndex = 0;

  galleryImages.forEach((img, index) => {
    img.addEventListener('click', () => {
      currentIndex = index;
      lightboxImg.src = img.src;
      lightbox.style.display = 'flex';
    });
  });

  window.prevImage = function() {
    currentIndex = (currentIndex - 1 + galleryImages.length) % galleryImages.length;
    lightboxImg.src = galleryImages[currentIndex].src;
  }

  window.nextImage = function() {
    currentIndex = (currentIndex + 1) % galleryImages.length;
    lightboxImg.src = galleryImages[currentIndex].src;
  }

  window.closeLightbox = function() {
    lightbox.style.display = 'none';
  }
});
</script>
